name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::784004374763:role/student-math-score-github-actions
          aws-region: ap-southeast-2

      - name: Start CodePipeline
        id: start
        run: |
          ID=$(aws codepipeline start-pipeline-execution \
            --name student-math-score-pipeline \
            --query pipelineExecutionId --output text)
          echo "execution-id=$ID" >> "$GITHUB_OUTPUT"
          echo "Started pipeline execution $ID"

      - name: Wait for deployment
        run: |
          ID="${{ steps.start.outputs.execution-id }}"
          for i in $(seq 1 90); do
            STATUS=$(aws codepipeline get-pipeline-execution \
              --pipeline-name student-math-score-pipeline \
              --pipeline-execution-id "$ID" \
              --query pipelineExecution.status --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Superseded) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the pipeline"
          exit 1
